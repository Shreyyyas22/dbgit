[project]
name = "dbgit"
version = "0.1.0"
description = "Git for Databases — version control for your data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic-settings>=2.2.1",
    "structlog>=24.1.0",
    "psycopg[binary]>=3.1.19",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "celery>=5.4.0",
    "redis>=5.0.4",
    "deepdiff>=7.0.1",
    "sqlglot>=23.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.4",
    "black>=24.4.2",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]
